<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
    }
    
    .glass-morphism {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15),
                  inset 0 0 20px 0 rgba(255, 255, 255, 0.05);
    }
    
    .glass-morphism-strong {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.25),
                  inset 0 0 30px 0 rgba(255, 255, 255, 0.08);
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.2),
                  inset 0 0 15px 0 rgba(255, 255, 255, 0.06);
    }
    
    .glow-border {
      position: relative;
      border: 1px solid transparent;
      background-clip: padding-box;
    }
    
    .glow-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.5), rgba(59, 130, 246, 0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    
    .glow-text {
      text-shadow: 0 0 20px rgba(96, 165, 250, 0.6),
                   0 0 40px rgba(59, 130, 246, 0.4);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }
    
    @keyframes bonus-celebration {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes unlock {
      0% { transform: scale(0.8) rotate(-10deg); opacity: 0; }
      50% { transform: scale(1.1) rotate(5deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    
    .fade-in {
      animation: fadeIn 0.6s ease-out;
    }
    
    .pulse-animation {
      animation: pulse 2s ease-in-out infinite;
    }
    
    .ripple {
      animation: ripple 1.5s ease-out infinite;
    }
    
    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      background-size: 1000px 100%;
      animation: shimmer 2s infinite;
    }
    
    .bonus-animation {
      animation: bonus-celebration 0.5s ease-in-out 3;
    }

    .unlock-animation {
      animation: unlock 0.6s ease-out;
    }
    
    .smooth-transition {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px 0 rgba(59, 130, 246, 0.3);
    }
    
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    .checkbox-custom {
      appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid rgba(96, 165, 250, 0.5);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      position: relative;
      transition: all 0.3s;
    }
    
    .checkbox-custom:checked {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      border-color: #3b82f6;
    }
    
    .checkbox-custom:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="w-full h-full m-0 p-0">
  <div id="app" class="w-full h-full"></div>
  <script>
    const defaultConfig = {
      background_color: "#0a0f1e",
      surface_color: "#1a2332",
      text_color: "#e0f2fe",
      primary_action_color: "#60a5fa",
      secondary_action_color: "#3b82f6",
      font_family: "Helvetica Neue",
      font_size: 16,
      app_title: "FocusFlow",
      tagline: "Clareza. Foco. Execução.",
      agent_greeting: "Vamos transformar seu caos em clareza",
      week_title: "Seu Painel de Foco",
      focus_mode_title: "Modo Foco Ativado",
      bonus_message: "Tempo Bônus Conquistado!"
    };

    let currentTasks = [];
    let currentView = 'welcome';
    let conversationData = {};
    let currentFocusTask = null;
    let currentFocusTaskIndex = 0;
    let pomodoroTimer = null;
    let pomodoroSeconds = 1500;
    let isPomodoroPaused = false;
    let completedSteps = [];
    let bonusTime = 0;
    let showBonusAnimation = false;
    let focusStartTime = null;
    let didNotPause = true;
    let selectedPlaylist = null;
    let showPlaylistSelector = false;
    let isInBreakDecision = false;
    let isInSprintMode = false;
    let isInOvertime = false;
    let stepTimestamps = {};
    let hasUsedSprintOrBreak = false;
    let isInBreakTimer = false;

    const achievementDefinitions = [
      { id: 'first_task', name: 'Primeira Missão', icon: '🎯', description: 'Complete sua primeira tarefa', condition: () => currentTasks.filter(t => t.completed).length >= 1 },
      { id: 'fast_task', name: 'Tarefa Relâmpago', icon: '⚡', description: 'Conclua uma tarefa em menos de 1 minuto', condition: () => currentTasks.some(t => t.completedInTime && t.focusTime <= 1) },
      { id: 'checklist_master', name: 'Checklist 100%', icon: '✅', description: 'Finalize todas as microetapas de uma tarefa', condition: () => currentTasks.some(t => t.completed && t.steps && t.steps.split(',').length > 0) },
      { id: 'focus_master', name: 'Foco Pleno', icon: '🧘', description: 'Complete um Pomodoro inteiro sem pausar', condition: () => currentTasks.some(t => t.pauseCount === 0 && t.completedPomodoros > 0) },
      { id: 'double_focus', name: 'Dupla de Foco', icon: '🔥', description: 'Execute duas tarefas no mesmo dia', condition: () => {
        const today = new Date().toISOString().split('T')[0];
        return currentTasks.filter(t => t.completed && t.createdAt && t.createdAt.startsWith(today)).length >= 2;
      }},
      { id: 'early_bird', name: 'Primeira do Dia', icon: '🌅', description: 'Complete a primeira tarefa do dia', condition: () => currentTasks.filter(t => t.completed).length >= 1 },
      { id: 'bonus_collector', name: 'Colecionador de Bônus', icon: '🎁', description: 'Acumule 30 minutos de tempo bônus', condition: () => {
        const totalBonus = currentTasks.reduce((sum, t) => sum + (t.bonusTime || 0), 0);
        return totalBonus >= 30;
      }},
      { id: 'task_five', name: 'Pentalha', icon: '⭐', description: 'Complete 5 tarefas', condition: () => currentTasks.filter(t => t.completed).length >= 5 },
      { id: 'task_ten', name: 'Decatlo', icon: '🏆', description: 'Complete 10 tarefas', condition: () => currentTasks.filter(t => t.completed).length >= 10 },
      { id: 'high_complexity', name: 'Desafiador', icon: '💎', description: 'Complete uma tarefa de alta complexidade', condition: () => currentTasks.some(t => t.completed && t.complexity === 'Alta') }
    ];

    let unlockedAchievements = [];

    const spotifyPlaylists = [
      { name: "Mc Donalds Vibes", url: "https://open.spotify.com/playlist/2gSjoVWOf40cd01KPrtvTu?si=06PKuGBER_yo_lLIYPtAFg", icon: "🍟", official: true },
      { name: "Deep Focus", url: "https://open.spotify.com/playlist/37i9dQZF1DWZeKCadgRdKQ", icon: "🎧" },
      { name: "Peaceful Piano", url: "https://open.spotify.com/playlist/37i9dQZF1DX4sWSpwq3LiO", icon: "🎹" },
      { name: "Lofi Beats", url: "https://open.spotify.com/playlist/37i9dQZF1DWWQRwui0ExPn", icon: "🎵" },
      { name: "Brain Food", url: "https://open.spotify.com/playlist/37i9dQZF1DWXLeA8Omikj7", icon: "🧠" },
      { name: "Ambient Relaxation", url: "https://open.spotify.com/playlist/37i9dQZF1DX3Ogo9pFvBkY", icon: "🌌" },
      { name: "Nature Sounds", url: "https://open.spotify.com/playlist/37i9dQZF1DX4PP3DA4J0N8", icon: "🌿" }
    ];

    const dataHandler = {
      onDataChanged(data) {
        currentTasks = data;
        checkAchievements();
        if (currentView === 'panel') {
          renderPanel();
        } else if (currentView === 'report') {
          renderReport();
        } else if (currentView === 'achievements') {
          renderAchievements();
        }
      }
    };

    function checkAchievements() {
      achievementDefinitions.forEach(achievement => {
        if (!unlockedAchievements.includes(achievement.id) && achievement.condition()) {
          unlockedAchievements.push(achievement.id);
          if (currentView !== 'welcome' && currentView !== 'chat') {
            showAchievementUnlock(achievement);
          }
        }
      });
    }

    function showAchievementUnlock(achievement) {
      const config = getConfig();
      const c = {
        primary: config.primary_action_color || defaultConfig.primary_action_color,
        text: config.text_color || defaultConfig.text_color,
        size: config.font_size || defaultConfig.font_size
      };

      const toast = document.createElement('div');
      toast.className = 'fixed top-24 right-8 px-8 py-6 rounded-2xl font-bold unlock-animation glass-morphism-strong glow-border';
      toast.style.background = `linear-gradient(135deg, ${c.primary}40, ${c.primary}60)`;
      toast.style.color = 'white';
      toast.style.fontSize = `${c.size * 1.1}px`;
      toast.style.zIndex = '9999';
      toast.style.boxShadow = `0 10px 40px ${c.primary}60`;
      toast.style.minWidth = '300px';
      toast.innerHTML = `
        <div class="flex items-center gap-4">
          <div style="font-size: ${c.size * 3}px;">${achievement.icon}</div>
          <div>
            <div style="font-size: ${c.size * 1.2}px; font-weight: 800; margin-bottom: 4px;">🎊 Conquista Desbloqueada!</div>
            <div style="font-size: ${c.size * 0.95}px; font-weight: 600;">${achievement.name}</div>
          </div>
        </div>
      `;
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(400px)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    async function init() {
      const initResult = await window.dataSdk.init(dataHandler);
      if (!initResult.isOk) {
        console.error("Failed to initialize SDK");
        return;
      }

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            applyConfig(config);
            renderCurrentView();
          },
          mapToCapabilities: (config) => ({
            recolorables: [
              {
                get: () => config.background_color || defaultConfig.background_color,
                set: (value) => {
                  config.background_color = value;
                  window.elementSdk.setConfig({ background_color: value });
                }
              },
              {
                get: () => config.surface_color || defaultConfig.surface_color,
                set: (value) => {
                  config.surface_color = value;
                  window.elementSdk.setConfig({ surface_color: value });
                }
              },
              {
                get: () => config.text_color || defaultConfig.text_color,
                set: (value) => {
                  config.text_color = value;
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
              {
                get: () => config.primary_action_color || defaultConfig.primary_action_color,
                set: (value) => {
                  config.primary_action_color = value;
                  window.elementSdk.setConfig({ primary_action_color: value });
                }
              },
              {
                get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                set: (value) => {
                  config.secondary_action_color = value;
                  window.elementSdk.setConfig({ secondary_action_color: value });
                }
              }
            ],
            borderables: [],
            fontEditable: {
              get: () => config.font_family || defaultConfig.font_family,
              set: (value) => {
                config.font_family = value;
                window.elementSdk.setConfig({ font_family: value });
              }
            },
            fontSizeable: {
              get: () => config.font_size || defaultConfig.font_size,
              set: (value) => {
                config.font_size = value;
                window.elementSdk.setConfig({ font_size: value });
              }
            }
          }),
          mapToEditPanelValues: (config) => new Map([
            ["app_title", config.app_title || defaultConfig.app_title],
            ["tagline", config.tagline || defaultConfig.tagline],
            ["agent_greeting", config.agent_greeting || defaultConfig.agent_greeting],
            ["week_title", config.week_title || defaultConfig.week_title],
            ["focus_mode_title", config.focus_mode_title || defaultConfig.focus_mode_title],
            ["bonus_message", config.bonus_message || defaultConfig.bonus_message]
          ])
        });
      }

      renderCurrentView();
    }

    function applyConfig(config) {
      const app = document.getElementById('app');
      const baseFont = config.font_family || defaultConfig.font_family;
      const baseFontStack = 'system-ui, -apple-system, sans-serif';
      const baseSize = config.font_size || defaultConfig.font_size;
      
      app.style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color}, ${config.surface_color || defaultConfig.surface_color})`;
      app.style.color = config.text_color || defaultConfig.text_color;
      app.style.fontFamily = `${baseFont}, ${baseFontStack}`;
      app.style.fontSize = `${baseSize}px`;
    }

    function getConfig() {
      return window.elementSdk ? window.elementSdk.config : defaultConfig;
    }

    function renderCurrentView() {
      switch(currentView) {
        case 'welcome':
          renderWelcome();
          break;
        case 'chat':
          renderChat();
          break;
        case 'panel':
          renderPanel();
          break;
        case 'focus':
          renderFocus();
          break;
        case 'library':
          renderLibrary();
          break;
        case 'report':
          renderReport();
          break;
        case 'achievements':
          renderAchievements();
          break;
        case 'create-card':
          renderCreateCard();
          break;
        case 'edit-card':
          renderEditCard();
          break;
      }
    }

    function renderWelcome() {
      const config = getConfig();
      const c = {
        bg: config.background_color || defaultConfig.background_color,
        surface: config.surface_color || defaultConfig.surface_color,
        text: config.text_color || defaultConfig.text_color,
        primary: config.primary_action_color || defaultConfig.primary_action_color,
        secondary: config.secondary_action_color || defaultConfig.secondary_action_color,
        size: config.font_size || defaultConfig.font_size
      };
      
      const app = document.getElementById('app');
      applyConfig(config);
      
      app.innerHTML = `
        <div class="w-full h-full flex items-center justify-center p-8" style="background: linear-gradient(135deg, ${c.bg}, ${c.surface});">
          <div class="max-w-3xl w-full text-center fade-in">
            <div class="mb-12">
              <div class="w-40 h-40 mx-auto mb-8 rounded-full flex items-center justify-center ripple glass-morphism-strong glow-border">
                <svg class="w-20 h-20 glow-text" style="color: ${c.primary}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
              <h1 class="mb-4 glow-text" style="font-size: ${c.size * 3.5}px; font-weight: 800; letter-spacing: -0.03em;">${config.app_title || defaultConfig.app_title}</h1>
              <p class="mb-12" style="font-size: ${c.size * 1.4}px; color: ${c.text}dd; font-weight: 600;">${config.tagline || defaultConfig.tagline}</p>
            </div>

            <div class="rounded-3xl p-10 mb-8 glass-morphism glow-border">
              <p class="mb-8" style="font-size: ${c.size * 1.15}px; line-height: 1.8; color: ${c.text}ee;">
                ${config.agent_greeting || defaultConfig.agent_greeting}. <br/>
                Organize suas tarefas, mantenha o foco e conquiste seus objetivos com inteligência.
              </p>
              
              <div class="grid grid-cols-2 gap-6 mb-8">
                <div class="p-6 rounded-2xl glass-card hover-lift smooth-transition">
                  <div class="text-5xl mb-3">🎯</div>
                  <p style="font-size: ${c.size * 1.05}px; color: ${c.text}; font-weight: 600;">Planejamento Inteligente</p>
                </div>
                <div class="p-6 rounded-2xl glass-card hover-lift smooth-transition">
                  <div class="text-5xl mb-3">🍅</div>
                  <p style="font-size: ${c.size * 1.05}px; color: ${c.text}; font-weight: 600;">Foco Profundo</p>
                </div>
              </div>

              <button onclick="startPlanning()" class="w-full py-5 rounded-2xl font-bold smooth-transition hover-lift" style="background: linear-gradient(135deg, ${c.primary}, ${c.secondary}); color: white; font-size: ${c.size * 1.2}px; box-shadow: 0 8px 30px ${c.primary}50;">
                Começar Agora →
              </button>
            </div>

            ${currentTasks.length > 0 ? `
              <button onclick="currentView='panel'; renderPanel();" class="smooth-transition hover-lift px-6 py-3 rounded-xl glass-card" style="color: ${c.text}; font-size: ${c.size * 0.95}px; font-weight: 600;">
                ou voltar ao painel
              </button>
            ` : `
              <button onclick="currentView='panel'; renderPanel();" class="smooth-transition hover-lift px-6 py-3 rounded-xl glass-card" style="color: ${c.text}; font-size: ${c.size * 0.95}px; font-weight: 600;">
                ou ir direto para os painéis
              </button>
            `}
          </div>
        </div>
      `;
    }

    function startPlanning() {
      conversationData = { step: 1, responses: {}, currentTask: {} };
      currentView = 'chat';
      renderChat();
    }

    function renderChat() {
      const config = getConfig();
      const c = {
        bg: config.background_color || defaultConfig.background_color,
        surface: config.surface_color || defaultConfig.surface_color,
        text: config.text_color || defaultConfig.text_color,
        primary: config.primary_action_color || defaultConfig.primary_action_color,
        secondary: config.secondary_action_color || defaultConfig.secondary_action_color,
        size: config.font_size || defaultConfig.font_size
      };
      
      const app = document.getElementById('app');
      applyConfig(config);

      const questions = [
        { q: "Qual tarefa você quer adicionar?", placeholder: "Ex: Finalizar relatório de vendas", key: "title", type: "text" },
        { q: "Essa tarefa é criativa, estratégica ou operacional?", placeholder: "Ex: Estratégica", key: "type", type: "select", options: ["Criativa", "Estratégica", "Operacional"] },
        { q: "Qual o nível de complexidade?", placeholder: "Ex: Alta", key: "complexity", type: "select", options: ["Baixa", "Média", "Alta"] },
        { q: "Quanto tempo você estima que vai levar?", placeholder: "Ex: 2 horas", key: "duration", type: "select", options: ["15 minutos", "30 minutos", "1 hora", "2 horas", "3 horas", "4 horas", "Mais de 4 horas"] },
        { q: "Quais são os passos para executar essa tarefa?", placeholder: "Ex: 1. Coletar dados, 2. Analisar, 3. Escrever relatório", key: "steps", type: "text" },
        { q: "Você precisa de algum recurso, arquivo ou link? (separe múltiplos links por vírgula)", placeholder: "Ex: https://docs.google.com/..., https://exemplo.com/...", key: "resourceLinks", type: "text" },
        { q: "Para qual dia da semana?", placeholder: "Ex: Quarta", key: "day", type: "select", options: ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"] },
        { q: "Como está sua energia hoje?", placeholder: "Ex: Média", key: "energy", type: "select", options: ["Baixa", "Média", "Alta"] }
      ];

      const currentQ = questions[conversationData.step - 1];
      const progress = (conversationData.step / questions.length) * 100;

      app.innerHTML = `
        <div class="w-full h-full flex flex-col" style="background: linear-gradient(135deg, ${c.bg}, ${c.surface});">
          <header class="p-6 glass-morphism">
            <div class="flex items-center justify-between max-w-5xl mx-auto">
              <div class="flex items-center gap-4">
                <button onclick="currentView='welcome'; renderWelcome();" class="w-12 h-12 rounded-xl flex items-center justify-center smooth-transition hover-lift glass-card" style="color: ${c.text};">
                  ←
                </button>
                <div>
                  <h2 style="font-size: ${c.size * 1.25}px; font-weight: 700;">Planejamento Assistido</h2>
                  <p style="font-size: ${c.size * 0.85}px; color: ${c.text}cc; font-weight: 600;">Passo ${conversationData.step} de ${questions.length}</p>
                </div>
              </div>
            </div>
          </header>

          <div class="w-full h-3 glass-card">
            <div class="h-full smooth-transition" style="width: ${progress}%; background: linear-gradient(90deg, ${c.primary}, ${c.secondary});"></div>
          </div>

          <main class="flex-1 overflow-y-auto p-8 hide-scrollbar">
            <div class="max-w-4xl mx-auto">
              <div class="mb-8 fade-in">
                <div class="flex gap-4 mb-8">
                  <div class="w-14 h-14 rounded-2xl flex items-center justify-center flex-shrink-0 glass-morphism-strong glow-border">
                    <span style="font-size: ${c.size * 1.8}px;">🤖</span>
                  </div>
                  <div class="flex-1 p-6 rounded-3xl glass-morphism glow-border">
                    <p style="font-size: ${c.size * 1.15}px; line-height: 1.7; font-weight: 600;">${currentQ.q}</p>
                  </div>
                </div>

                ${Object.keys(conversationData.responses).length > 0 ? `
                  <div class="space-y-4 mb-8">
                    ${Object.entries(conversationData.responses).map(([key, value]) => `
                      <div class="flex gap-4 justify-end">
                        <div class="max-w-xl p-5 rounded-3xl glass-card glow-border">
                          <p style="font-size: ${c.size * 1.05}px; color: ${c.primary}; font-weight: 600;">${value}</p>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            </div>
          </main>

          <footer class="p-6 glass-morphism">
            <div class="max-w-4xl mx-auto">
              <form onsubmit="handleChatResponse(event, '${currentQ.key}')" class="space-y-4">

                  <select 
                    id="chat-select" 
                    class="w-full px-6 py-5 rounded-2xl outline-none smooth-transition glass-card glow-border"
                    style="color: #1a2332; background: rgba(224, 242, 254, 0.95); font-size: ${c.size * 1.05}px; font-weight: 700;"
                    required
                  >
                    <option value="" style="color: #1a2332;">Selecione uma opção...</option>
                    ${currentQ.options.map(opt => `<option value="${opt}" style="color: #1a2332; font-weight: 600;">${opt}</option>`).join('')}
                  </select>
                  <div style="color: ${c.text}cc; font-size: ${c.size * 0.85}px; text-align: center; font-weight: 600;">ou escreva manualmente:</div>
                ` : ''}
                <div class="flex gap-4">
                  <input 
                    type="text" 
                    id="chat-input" 
                    placeholder="${currentQ.placeholder}"
                    class="flex-1 px-6 py-5 rounded-2xl outline-none smooth-transition glass-card glow-border"
                    style="color: ${c.text}; font-size: ${c.size * 1.05}px; font-weight: 600;"
                    ${currentQ.type === 'text' ? 'required' : ''}
                    autofocus
                  >
                  <button type="submit" class="px-10 py-5 rounded-2xl font-bold smooth-transition hover-lift" style="background: linear-gradient(135deg, ${c.primary}, ${c.secondary}); color: white; font-size: ${c.size * 1.05}px; box-shadow: 0 4px 20px ${c.primary}40;">
                    ${conversationData.step === questions.length ? 'Finalizar ✓' : 'Continuar →'}
                  </button>
                </div>
              </form>
            </div>
          </footer>
        </div>
      `;
    }

    async function handleChatResponse(event, key) {
      event.preventDefault();
      const input = document.getElementById('chat-input');
      const select = document.getElementById('chat-select');
      let value = input.value.trim();
      
      if (!value && select && select.value) {
        value = select.value;
      }
      
      if (!value) return;

      conversationData.responses[`q${conversationData.step}`] = value;
      conversationData.currentTask[key] = value;

      if (conversationData.step === 8) {
        await createTaskFromConversation();
        
        showCustomModal(
          "Tarefa criada com sucesso! 🏆",
          "Deseja adicionar mais uma tarefa?",
          () => {
            conversationData = { step: 1, responses: {}, currentTask: {} };
            renderChat();
          },
          () => {
            currentView = 'panel';
            renderPanel();
          },
          "Adicionar outra",
          "Ver painel"
        );
      } else {
        conversationData.step++;
        renderChat();
      }
    }

    async function createTaskFromConversation() {
      if (currentTasks.length >= 999) {
        showToast("Limite de 999 tarefas atingido", "error");
        return;
      }

      const task = conversationData.currentTask;
      const complexity = task.complexity || "Média";
      const pomodoros = complexity.toLowerCase().includes('alta') ? 4 : 
                       complexity.toLowerCase().includes('baixa') ? 1 : 2;
      
      const durationText = task.duration || "60";
      const durationMinutes = parseInt(durationText.match(/\d+/)?.[0] || 60);

      await window.dataSdk.create({
        id: `task-${Date.now()}-${Math.random()}`,
        title: task.title || "Nova Tarefa",
        description: "",
        type: task.type || "Operacional",
        complexity: complexity,
        pomodoros: pomodoros,
        duration: durationMinutes,
        day: task.day || "Segunda",
        completed: false,
        energy: task.energy || "Média",
        priority: complexity.toLowerCase().includes('alta') ? 'Alta' : 
                 complexity.toLowerCase().includes('baixa') ? 'Baixa' : 'Média',
        createdAt: new Date().toISOString(),
        completedPomodoros: 0,
        focusTime: 0,
        bonusTime: 0,
        steps: task.steps || "",
        resourceLinks: task.resourceLinks || "",
        completedInTime: false,
        pauseCount: 0
      });
    }

      const icon = typeIcons[task.type] || '📌';
      
      return `

    async function toggleTaskComplete(taskId) {
      const task = currentTasks.find(t => t.__backendId === taskId);
      if (!task) return;

      task.completed = !task.completed;
      const result = await window.dataSdk.update(task);
      
      if (result.isOk) {
        renderPanel();
      }
    }

    function addToFocusQueue(taskId) {
      const task = currentTasks.find(t => t.__backendId === taskId);
      if (!task) return;
      
      // Se já existe uma tarefa em foco, confirma antes de trocar
      if (currentFocusTask && currentFocusTask.__backendId !== taskId) {
        showCustomModal(
          "Trocar de Tarefa?",
          "Você já está focado em outra tarefa. Se trocar agora, perderá todo o progresso atual do Pomodoro. Deseja continuar?",
          () => {
            // Limpa o timer atual
            if (pomodoroTimer) clearInterval(pomodoroTimer);
            
            // Inicia nova tarefa
            currentFocusTask = task;
            currentFocusTaskIndex = 0;
            pomodoroSeconds = 1500;
            isPomodoroPaused = false;
            completedSteps = [];
            bonusTime = 0;
            showBonusAnimation = false;
            focusStartTime = Date.now();
            didNotPause = true;
            isInBreakDecision = false;
            isInSprintMode = false;
            isInOvertime = false;
            stepTimestamps = {};
            hasUsedSprintOrBreak = false;
            isInBreakTimer = false;
            currentView = 'focus';
            renderFocus();
            startPomodoroTimer();
          },
          () => {},
          "Sim, trocar",
          "Não, continuar atual"
        );
        return;
      }
      
      // Inicia nova tarefa
      currentFocusTask = task;
      currentFocusTaskIndex = 0;
      pomodoroSeconds = 1500;
      isPomodoroPaused = false;
      completedSteps = [];
      bonusTime = 0;
      showBonusAnimation = false;
      focusStartTime = Date.now();
      didNotPause = true;
      isInBreakDecision = false;
      isInSprintMode = false;
      isInOvertime = false;
      stepTimestamps = {};
      hasUsedSprintOrBreak = false;
      isInBreakTimer = false;
      currentView = 'focus';
      renderFocus();
      startPomodoroTimer();
    }

    function editTask(taskId) {
      const task = currentTasks.find(t => t.__backendId === taskId);
      if (!task) return;
      
      conversationData.editingTask = task;
      currentView = 'edit-card';
      renderEditCard();
    }

    async function handleCreateCard(event) {
      event.preventDefault();
      
      if (currentTasks.length >= 999) {
        showToast("Limite de 999 tarefas atingido", "error");
        return;
      }

      const title = document.getElementById('create-title').value;
      const type = document.getElementById('create-type').value;
      const complexity = document.getElementById('create-complexity').value;
      const day = document.getElementById('create-day').value;
      const energy = document.getElementById('create-energy').value;
      const duration = parseInt(document.getElementById('create-duration').value);
      const steps = document.getElementById('create-steps').value;
      const resourceLinks = document.getElementById('create-links').value;

      const pomodoros = complexity === 'Alta' ? 4 : complexity === 'Baixa' ? 1 : 2;

      const result = await window.dataSdk.create({
        id: `task-${Date.now()}-${Math.random()}`,
        title: title,
        description: "",
        type: type,
        complexity: complexity,
        pomodoros: pomodoros,
        duration: duration,
        day: day,
        completed: false,
        energy: energy,
        priority: complexity === 'Alta' ? 'Alta' : complexity === 'Baixa' ? 'Baixa' : 'Média',
        createdAt: new Date().toISOString(),
        completedPomodoros: 0,
        focusTime: 0,
        bonusTime: 0,
        steps: steps,
        resourceLinks: resourceLinks,
        completedInTime: false,
        pauseCount: 0
      });

      if (result.isOk) {
        showToast("Tarefa criada com sucesso! 🎉", "success");
        currentView = 'panel';
        renderPanel();
      } else {
        showToast("Erro ao criar tarefa", "error");
      }
    }

    async function handleEditCard(event) {
      event.preventDefault();
      
      const task = conversationData.editingTask;
      if (!task) return;

      task.title = document.getElementById('edit-title').value;
      task.type = document.getElementById('edit-type').value;
      task.complexity = document.getElementById('edit-complexity').value;
      task.day = document.getElementById('edit-day').value;
      task.energy = document.getElementById('edit-energy').value;
      task.duration = parseInt(document.getElementById('edit-duration').value);
      task.steps = document.getElementById('edit-steps').value;
      task.resourceLinks = document.getElementById('edit-links').value;
      task.pomodoros = task.complexity === 'Alta' ? 4 : task.complexity === 'Baixa' ? 1 : 2;

      const result = await window.dataSdk.update(task);

      if (result.isOk) {
        showToast("Tarefa atualizada! ✓", "success");

        currentView = 'panel';
        renderPanel();
      } else {
        showToast("Erro ao atualizar tarefa", "error");
      }
    }

    function toggleStep(index) {
      if (completedSteps.includes(index)) {
        completedSteps = completedSteps.filter(i => i !== index);
        delete stepTimestamps[index];
      } else {
        completedSteps.push(index);
        const focusElapsed = Math.floor((Date.now() - focusStartTime) / 60000);
        stepTimestamps[index] = focusElapsed;
      }
      renderFocus();
    }

    function startPomodoroTimer() {
      if (pomodoroTimer) clearInterval(pomodoroTimer);
      
      pomodoroTimer = setInterval(() => {
        if (!isPomodoroPaused && pomodoroSeconds > 0) {
          pomodoroSeconds--;
          if (currentView === 'focus') {
            renderFocus();
          } else {
            updateTimerDisplay();
          }
          
          if (pomodoroSeconds === 0) {
            if (isInSprintMode) {
              // Sprint acabou, inicia descanso de 1 minuto
              isInSprintMode = false;
              isInBreakTimer = true;
              pomodoroSeconds = 60;
              hasUsedSprintOrBreak = true;
              renderFocus();
            } else if (isInBreakTimer) {
              // Descanso de 1 minuto acabou, vai para overtime
              isInBreakTimer = false;
              startOvertime();
            } else if (!hasUsedSprintOrBreak) {
              // Primeira vez que o tempo acabou
              completePomodoroSession();
            } else {
              // Já usou sprint ou descanso, vai direto para overtime
              startOvertime();
            }
          }
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const timerContainer = document.querySelector('.focus-timer-container');
      if (timerContainer && currentFocusTask) {
        const minutes = Math.floor(pomodoroSeconds / 60);
        const seconds = pomodoroSeconds % 60;
        const timeDisplay = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        
        const timerElement = timerContainer.querySelector('.focus-timer-display');
        if (timerElement) {
          timerElement.textContent = timeDisplay;
        }
      }
    }

    async function completePomodoroSession() {
      if (pomodoroTimer) clearInterval(pomodoroTimer);
      
      if (currentFocusTask) {
        const focusDurationMinutes = Math.floor((Date.now() - focusStartTime) / 60000);
        
        currentFocusTask.completedPomodoros = (currentFocusTask.completedPomodoros || 0) + 1;
        currentFocusTask.focusTime = (currentFocusTask.focusTime || 0) + 25;
        currentFocusTask.pauseCount = (currentFocusTask.pauseCount || 0) + (didNotPause ? 0 : 1);
        
        if (bonusTime > 0) {
          currentFocusTask.bonusTime = (currentFocusTask.bonusTime || 0) + bonusTime;
          currentFocusTask.completedInTime = true;
        }
        
        if (currentFocusTask.completedPomodoros >= currentFocusTask.pomodoros) {
          // Oferece opções quando o tempo acaba
          isInBreakDecision = true;
          renderFocus();
          return;
        }
        
        await window.dataSdk.update(currentFocusTask);
        checkAchievements();
      }
      
      showToast("Pomodoro concluído! Parabéns! 🎉", "success");
      
      setTimeout(() => {
        exitFocus();
      }, 2000);
    }

    function startBreak() {
      isInBreakDecision = false;
      hasUsedSprintOrBreak = true;
      pomodoroSeconds = 300; // 5 minutos de descanso
      renderFocus();
      startPomodoroTimer();
    }

    function startSprint() {
      isInBreakDecision = false;
      isInSprintMode = true;
      pomodoroSeconds = 300; // 5 minutos de sprint
      renderFocus();
      startPomodoroTimer();
    }

    function useBonus() {
      const totalBonusTime = currentTasks.reduce((sum, t) => sum + (t.bonusTime || 0), 0);
      
      if (totalBonusTime <= 0) {
        showToast("Você não tem tempo bônus disponível", "error");
        return;
      }
      
      isInBreakDecision = false;
      const bonusToUse = Math.min(totalBonusTime, 25);
      pomodoroSeconds = bonusToUse * 60;
      
      // Deduz o bônus usado
      let remaining = bonusToUse;
      for (let task of currentTasks) {
        if (remaining <= 0) break;
        if (task.bonusTime > 0) {
          const deduct = Math.min(task.bonusTime, remaining);
          task.bonusTime -= deduct;
          remaining -= deduct;
          window.dataSdk.update(task);
        }
      }
      
      renderFocus();
      startPomodoroTimer();
    }

    function startOvertime() {
      if (pomodoroTimer) clearInterval(pomodoroTimer);
      isInSprintMode = false;
      isInOvertime = true;
      pomodoroSeconds = 0;
      renderFocus();
      
      // Inicia contagem progressiva (negativa)
      pomodoroTimer = setInterval(() => {
        pomodoroSeconds++;
        if (currentView === 'focus') {
          renderFocus();
        } else {
          updateTimerDisplay();
        }
      }, 1000);
    }

    async function completeTaskEarly() {
      if (!currentFocusTask) return;

      showCustomModal(
        "Concluir Tarefa Agora",
        isInOvertime ? `Você está em tempo extra! Deseja concluir a tarefa? ${Math.ceil(pomodoroSeconds / 60)} minutos serão deduzidos do seu bônus.` : "Deseja concluir esta tarefa antecipadamente? O tempo restante do Pomodoro será adicionado como bônus!",
        async () => {
          if (pomodoroTimer) clearInterval(pomodoroTimer);
          
          let bonusMinutes = 0;
          if (isInOvertime) {
            bonusMinutes = -Math.ceil(pomodoroSeconds / 60);
          } else if (!isInBreakDecision) {
            bonusMinutes = Math.ceil(pomodoroSeconds / 60);
          }
          
          const focusDurationMinutes = Math.floor((Date.now() - focusStartTime) / 60000);
          
          currentFocusTask.completed = true;
          currentFocusTask.completedPomodoros = (currentFocusTask.completedPomodoros || 0) + 1;
          currentFocusTask.focusTime = (currentFocusTask.focusTime || 0) + focusDurationMinutes;
          currentFocusTask.bonusTime = (currentFocusTask.bonusTime || 0) + bonusMinutes;
          currentFocusTask.completedInTime = bonusMinutes > 0;
          currentFocusTask.pauseCount = (currentFocusTask.pauseCount || 0) + (didNotPause ? 0 : 1);
          
          const result = await window.dataSdk.update(currentFocusTask);
          
          if (result.isOk) {
            checkAchievements();
            if (bonusMinutes > 0) {
              showToast(`🎉 Tarefa concluída! +${bonusMinutes} minutos de bônus!`, "success");
            } else if (bonusMinutes < 0) {
              showToast(`✓ Tarefa concluída! ${bonusMinutes} minutos de penalidade`, "success");
            } else {
              showToast("🎉 Tarefa concluída!", "success");
            }
            
            setTimeout(() => {
              exitFocus();
            }, 2000);
          } else {
            showToast("Erro ao concluir tarefa", "error");
          }
        },
        () => {},
        "Sim, concluir",
        "Continuar focando"
      );
    }
