<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .screen { display: none; }
    .active { display: block; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
  <div id="app" class="max-w-xl mx-auto">
    <div id="homeScreen" class="screen active">
      <h1 class="text-3xl font-bold mb-4">FocusFlow</h1>
      <button onclick="openScreen('taskScreen')" class="bg-blue-500 p-3 rounded w-full mb-3">Criar Tarefa</button>
      <button onclick="openScreen('timerScreen')" class="bg-purple-500 p-3 rounded w-full mb-3">Timer</button>
      <button onclick="openScreen('notesScreen')" class="bg-green-500 p-3 rounded w-full">Anotações</button>
    </div>

    <div id="taskScreen" class="screen">
      <h2 class="text-2xl font-semibold mb-4">Tarefas</h2>
      <input id="taskInput" class="p-2 w-full rounded bg-gray-800 mb-3" placeholder="Digite uma tarefa" />
      <button onclick="addTask()" class="bg-blue-600 p-2 rounded w-full mb-4">Adicionar</button>
      <ul id="taskList" class="space-y-2"></ul>
      <button onclick="openScreen('homeScreen')" class="mt-4 bg-gray-700 p-2 rounded w-full">Voltar</button>
    </div>

    <div id="timerScreen" class="screen">
      <h2 class="text-2xl font-semibold mb-4">Timer</h2>
      <div id="timerDisplay" class="text-4xl font-bold mb-4">25:00</div>
      <button onclick="startTimer()" class="bg-green-600 p-2 rounded w-full mb-2">Iniciar</button>
      <button onclick="resetTimer()" class="bg-red-600 p-2 rounded w-full mb-4">Resetar</button>
      <button onclick="openScreen('homeScreen')" class="bg-gray-700 p-2 rounded w-full">Voltar</button>
    </div>

    <div id="notesScreen" class="screen">
      <h2 class="text-2xl font-semibold mb-4">Anotações</h2>
      <textarea id="notesArea" class="w-full h-40 p-2 rounded bg-gray-800 mb-4"></textarea>
      <button onclick="saveNotes()" class="bg-green-600 p-2 rounded w-full mb-2">Salvar</button>
      <button onclick="openScreen('homeScreen')" class="bg-gray-700 p-2 rounded w-full">Voltar</button>
    </div>
  </div>

<script>
  function openScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function loadTasks() {
    const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    tasks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'bg-gray-800 p-2 rounded flex justify-between';
      li.innerHTML = `${t} <button onclick="deleteTask(${i})" class='text-red-400'>X</button>`;
      list.appendChild(li);
    });
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const value = input.value.trim();
    if (!value) return;
    const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    tasks.push(value);
    localStorage.setItem('tasks', JSON.stringify(tasks));
    input.value = '';
    loadTasks();
  }

  function deleteTask(i) {
    const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    tasks.splice(i, 1);
    localStorage.setItem('tasks', JSON.stringify(tasks));
    loadTasks();
  }

  let timer;
  let timeLeft = 25 * 60;

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        clearInterval(timer);
        alert('Tempo finalizado!');
      }
    }, 1000);
  }

  function resetTimer() {
    clearInterval(timer);
    timeLeft = 25 * 60;
    updateTimerDisplay();
  }

  function updateTimerDisplay() {
    const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
    const s = String(timeLeft % 60).padStart(2, '0');
    document.getElementById('timerDisplay').textContent = `${m}:${s}`;
  }

  function loadNotes() {
    document.getElementById('notesArea').value = localStorage.getItem('notes') || '';
  }

  function saveNotes() {
    localStorage.setItem('notes', document.getElementById('notesArea').value);
    alert('Anotações salvas!');
  }

  loadTasks();
  loadNotes();
</script>
</body>
</html>
